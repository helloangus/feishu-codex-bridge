name: Regression
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo xtask check-boundaries
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Repository has no Python implementation or tooling
        run: |
          test -z "$(git ls-files '*.py' '*.pyi' '*.pyc' 'requirements*.txt')"
          ! rg -n 'python3|python -m|pip install' --glob '!*.yml'
      - name: Shell syntax
        run: bash -n setup.sh start.sh package.sh
      - run: git diff --check
