name: Regression
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked dependencies
        run: cargo xtask fetch
      - name: Full verification
        run: cargo xtask check --offline
      - name: Release package smoke test
        run: |
          cargo xtask package dist-smoke
          cd dist-smoke
          ./bridge --help > /dev/null
          ./bridge --version
          sha256sum -c SHA256SUMS
