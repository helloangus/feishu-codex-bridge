[package]
name = "bridge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# The package ships exactly one product binary; test fakes live in the
# dedicated test-support package.
default-run = "bridge"

[[bin]]
name = "bridge"
path = "src/main.rs"

[dependencies]
tempfile.workspace = true
bridge-core.workspace = true
bridge-local.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
bridge-app.workspace = true
bridge-codex.workspace = true
bridge-feishu.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
fs2.workspace = true
sha2.workspace = true
rustix = { workspace = true, features = ["fs", "process", "termios"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
